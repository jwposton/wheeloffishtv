[project]
name = "wheeloffish"
version = "1.0.0"
description = "Wheel of Fish TV — self-hosted TV playlist builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler~=3.11.2",
    "cryptography>=42.0",
    "fastapi==0.136.1",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheeloffish"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
